name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: creatordesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/creatordesk_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/creatordesk_test
      AUTH_SECRET: ci-only-not-a-real-secret
      AUTH_DEV_LOGIN: "false"
      DATA_ENCRYPTION_KEY: Y2ktb25seS10ZXN0LWtleS1ub3QtYS1zZWNyZXQtMzI=  # test-only, not a secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      # Fails on critical advisories in packages the app ships (CLI-only dev tools are excluded).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      # Uses the Google Chrome that GitHub's Ubuntu runners already have.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
